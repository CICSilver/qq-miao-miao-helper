# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true

# 注意：这里原本有两行只适用于 aarch64 Linux 的设置，已移除 ——
#
#   org.gradle.jvmargs 里的 -XX:-UseContainerSupport
#       该选项是 Linux 专有的，Windows/macOS 的 HotSpot 遇到未知 -XX 选项
#       会拒绝启动，导致 Gradle 守护进程根本起不来。
#
#   android.aapt2FromMavenOverride=/usr/bin/aapt2
#       硬编码的 Linux 路径。原作者在 aarch64 机器上构建，因为 Maven 上的
#       aapt2 只有 x86_64 版本，只好指向系统自带的那个。但这个路径在其它
#       任何平台上都不存在，会让构建直接失败。
#       去掉之后 AGP 会自动取与当前平台匹配的 aapt2。
#
# 如果你确实要在 aarch64 Linux 上构建，把这两行按需加回来即可。
